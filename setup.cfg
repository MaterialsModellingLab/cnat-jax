[metadata]
name = cnat_jax
author = "Aoi Watanabe"
description = Comprehensive Neighbor atom Analysis Transformer
long_description = file: README.md
long_description_content_type = text/markdown
version = attr: cnat_jax.__version__
license = Apache-2.0
license_files = LICENSE

[options]
python_requires = >=3.10, <3.13
zip_safe = false
packages = find:
install_requires =
  absl-py
  clu
  flax
  jax
  ml-collections
  pandas
  scipy
  tensorflow >= 2.16.0, < 2.21.0
  tensorflow-datasets
  tensorflow_graphics

[options.extras_require]
test =
  pytest

[options.entry_points]
console_scripts =
  cnat-jax = cnat_jax.main:run

[options.packages.find]
where=src
